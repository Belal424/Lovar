<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f5ef"><title>LOVAR | Checkout</title>
<style>
:root{--ink:#211f1b;--muted:#817c72;--gold:#ad8c51;--paper:#fffdfa;--line:#e9e3d8;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:var(--ink);font:14px var(--sans)}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}.header{height:80px;background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 6.2%;border-bottom:1px solid var(--line)}.logo{font:600 38px var(--serif);letter-spacing:.18em}.lang{border:0;background:none;text-transform:uppercase;font-size:10px;cursor:pointer}.wrap{max-width:1120px;margin:55px auto;padding:0 22px}.title{font:500 48px var(--serif);margin:0 0 8px}.sub{color:var(--muted);font-size:12px;margin:0 0 30px}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:start}.panel{background:var(--paper);padding:30px;border:1px solid var(--line)}h2{font:500 29px var(--serif);margin:0 0 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field.full{grid-column:1/-1}.field label{display:block;font-size:10px;color:#70695e;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:white;padding:13px;font-size:12px;outline:none}.field textarea{min-height:86px;resize:vertical}.summary-line{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.summary-line.total{font-size:16px;font-weight:700;border-bottom:0}.items{margin-bottom:15px}.item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}.item img{width:58px;height:65px;object-fit:cover;background:#eee}.item small{display:block;color:var(--muted);margin-top:5px}.coupon{display:flex;gap:8px;margin:18px 0}.coupon input{min-width:0;flex:1;border:1px solid var(--line);padding:11px}.coupon button{border:1px solid var(--ink);background:white;padding:0 15px;font-size:10px}.notice{background:#f2eee6;padding:13px;font-size:10px;color:#6f685d;line-height:1.7;margin:18px 0}.btn{width:100%;border:1px solid var(--ink);background:var(--ink);color:white;padding:16px;text-transform:uppercase;letter-spacing:.13em;font-size:10px;cursor:pointer}.btn:disabled{opacity:.5}.error{color:#a64f43;font-size:11px;margin-top:10px}.success{display:none;text-align:center;padding:30px}.success.show{display:block}.empty{background:white;padding:25px;text-align:center;color:var(--muted)}.lang-ar{font-family:Arial,Tahoma,sans-serif}html[dir=rtl] .header,html[dir=rtl] .layout{direction:rtl}html[dir=rtl] .title,html[dir=rtl] .sub{text-align:right}@media(max-width:800px){.layout{grid-template-columns:1fr}.wrap{margin:28px auto}.panel{padding:20px}.title{font-size:40px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.header{padding:0 18px}.logo{font-size:30px}}
</style>

  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head><body><header class="header"><a class="logo" href="./index.html">LOVAR</a><button class="lang" id="languageToggle">العربية</button></header><main class="wrap"><h1 class="title" id="pageTitle">Checkout</h1><p class="sub" id="pageSub">Complete your delivery details and review your order.</p><div class="layout" id="checkoutLayout"><section class="panel"><h2 id="detailsTitle">Delivery details</h2><form id="checkoutForm"><div class="grid"><div class="field full"><label id="nameLabel" for="name">Full name *</label><input id="name" required minlength="3" autocomplete="name"></div><div class="field"><label id="phoneLabel" for="phone">Phone number *</label><input id="phone" required inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx"></div><div class="field"><label id="emailLabel" for="email">Email (optional)</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label id="govLabel" for="gov">Governorate *</label><select id="gov" required><option value="">Choose governorate</option><option>Cairo</option><option>Giza</option><option>Alexandria</option><option>Dakahlia</option><option>Red Sea</option><option>Beheira</option><option>Fayoum</option><option>Gharbia</option><option>Ismailia</option><option>Menoufia</option><option>Minya</option><option>Qalyubia</option><option>New Valley</option><option>Suez</option><option>Aswan</option><option>Assiut</option><option>Beni Suef</option><option>Port Said</option><option>Damietta</option><option>Sharkia</option><option>South Sinai</option><option>Kafr El Sheikh</option><option>Matrouh</option><option>Luxor</option><option>Qena</option><option>North Sinai</option><option>Sohag</option><option>Other</option></select></div><div class="field"><label id="cityLabel" for="city">City / District *</label><input id="city" required></div><div class="field full"><label id="addressLabel" for="address">Full delivery address *</label><textarea id="address" required placeholder="Street, building number, floor and apartment"></textarea></div><div class="field full"><label id="notesLabel" for="notes">Delivery instructions (optional)</label><input id="notes" placeholder="A nearby landmark or helpful details"></div></div><div class="notice" id="codNotice">Payment method: Cash on Delivery. The final total is recalculated using current prices, stock and offers.</div><button class="btn" id="submitBtn" type="submit">Place order · Cash on delivery</button><div class="error" id="error"></div></form><div class="success" id="success"><h2 id="thanks">Thank you.</h2><p id="successText"></p><a class="btn" href="./index.html" id="continue">Continue shopping</a></div></section><aside class="panel"><h2 id="summaryTitle">Your order</h2><div class="items" id="items"></div><div class="coupon"><input id="coupon" placeholder="Discount code"><button id="applyCoupon" type="button">Apply</button></div><div id="totals"></div></aside></div></main><script src="./api-config.js"></script><script src="./api-client.js"></script><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),img=u=>/^https:\/\//i.test(String(u||''))?u:'https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?auto=format&fit=crop&w=300&q=70',money=n=>'EGP '+Number(n||0).toLocaleString('en-EG');let lang=localStorage.getItem('lovar_lang')||'en',cart=JSON.parse(localStorage.getItem('lovar_cart')||'[]'),coupon=localStorage.getItem('lovar_coupon')||'',products=[],settings={},quote=null;
const T={en:{title:'Checkout',sub:'Complete your delivery details and review your order.',details:'Delivery details',name:'Full name *',phone:'Phone number *',email:'Email (optional)',gov:'Governorate *',choose:'Choose governorate',city:'City / District *',address:'Full delivery address *',addressPh:'Street, building number, floor and apartment',notes:'Delivery instructions (optional)',notesPh:'A nearby landmark or helpful details',cod:'Payment method: Cash on Delivery. The final total is recalculated using current prices, stock and offers.',place:'Place order · Cash on delivery',summary:'Your order',apply:'Apply',discount:'Discount code',subtotal:'Subtotal',discounts:'Discounts',shipping:'Shipping',total:'Total',thanks:'Thank you.',continue:'Continue shopping',empty:'Your bag is empty. Add products before checkout.',back:'Please complete the required fields.'},ar:{title:'إتمام الشراء',sub:'أدخلي بيانات التوصيل وراجعي تفاصيل طلبك.',details:'بيانات التوصيل',name:'الاسم بالكامل *',phone:'رقم الهاتف *',email:'البريد الإلكتروني (اختياري)',gov:'المحافظة *',choose:'اختاري المحافظة',city:'المدينة / المنطقة *',address:'عنوان التوصيل بالتفصيل *',addressPh:'الشارع ورقم العقار والدور والشقة',notes:'تعليمات التوصيل (اختياري)',notesPh:'علامة مميزة قريبة أو تفاصيل تساعد في التوصيل',cod:'طريقة الدفع: نقدًا عند الاستلام. يتم تحديث الإجمالي وفق الأسعار والمخزون والعروض الحالية.',place:'تأكيد الطلب · الدفع عند الاستلام',summary:'طلبك',apply:'تطبيق',discount:'كود الخصم',subtotal:'المجموع الفرعي',discounts:'الخصومات',shipping:'الشحن',total:'الإجمالي',thanks:'شكرًا لطلبك.',continue:'متابعة التسوق',empty:'السلة فارغة. أضيفي منتجات قبل إتمام الشراء.',back:'من فضلك استكملي البيانات المطلوبة.'}};
function applyLang(){let d=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.body.classList.toggle('lang-ar',lang==='ar');const map={pageTitle:'title',pageSub:'sub',detailsTitle:'details',nameLabel:'name',phoneLabel:'phone',emailLabel:'email',govLabel:'gov',cityLabel:'city',addressLabel:'address',notesLabel:'notes',codNotice:'cod',submitBtn:'place',summaryTitle:'summaryTitle',applyCoupon:'apply',thanks:'thanks',continue:'continue'};Object.entries(map).forEach(([id,k])=>$(id).textContent=d[k]);$('address').placeholder=d.addressPh;$('notes').placeholder=d.notesPh;$('coupon').placeholder=d.discount;$('languageToggle').textContent=lang==='ar'?'English':'العربية';$('pageTitle').textContent=d.title;$('pageSub').textContent=d.sub;$('gov').options[0].textContent=d.choose;}
function save(){localStorage.setItem('lovar_cart',JSON.stringify(cart));localStorage.setItem('lovar_coupon',coupon)}function renderItems(){if(!cart.length){$('items').innerHTML='<div class="empty">'+T[lang].empty+'</div>';return}$('items').innerHTML=cart.map(x=>{let p=products.find(p=>String(p.id)===String(x.productId));return p?`<div class="item"><img src="${esc(img(p.image))}"><div style="flex:1"><strong>${esc(p.name)}</strong><small>${x.quantity} × ${money(p.salePrice>0&&p.salePrice<p.price?p.salePrice:p.price)}</small></div></div>`:''}).join('')}
async function updateQuote(){if(!cart.length)return;try{quote=await LovarApi.call('getQuote',[{items:cart,governorate:$('gov').value||'Cairo',couponCode:coupon}]);let s=quote.summary;let d=T[lang];$('totals').innerHTML=`<div class="summary-line"><span>${d.subtotal}</span><b>${money(s.originalSubtotal)}</b></div><div class="summary-line"><span>${d.discounts}</span><b>− ${money(s.productDiscount+s.bundleDiscount+s.couponDiscount)}</b></div><div class="summary-line"><span>${d.shipping}</span><b>${money(s.shippingFee-s.shippingDiscount)}</b></div><div class="summary-line total"><span>${d.total}</span><b>${money(s.total)}</b></div>${quote.couponError?`<p class="error">${esc(quote.couponError)}</p>`:''}`}catch(e){$('error').textContent=e.message}}
async function init(){applyLang();try{let d=await LovarApi.call('getPublicData',[]);products=d.products||[];settings=d.settings||{};renderItems();if(cart.length)await updateQuote();}catch(e){$('error').textContent=e.message}}
$('languageToggle').onclick=()=>{lang=lang==='en'?'ar':'en';localStorage.setItem('lovar_lang',lang);applyLang();renderItems();if(cart.length)updateQuote()};$('gov').onchange=updateQuote;$('applyCoupon').onclick=()=>{coupon=$('coupon').value.trim().toUpperCase();save();updateQuote()};$('coupon').value=coupon;
$('checkoutForm').onsubmit=async e=>{e.preventDefault();$('error').textContent='';if(!cart.length){$('error').textContent=T[lang].empty;return}let btn=$('submitBtn');btn.disabled=true;btn.textContent=lang==='ar'?'جارٍ إرسال الطلب…':'Placing your order…';let customer={name:$('name').value,phone:$('phone').value,email:$('email').value,governorate:$('gov').value,city:$('city').value,address:$('address').value,notes:$('notes').value};try{let result=await LovarApi.call('createOrder',[{items:cart,customer,couponCode:coupon}]);cart=[];coupon='';save();$('checkoutForm').style.display='none';$('success').classList.add('show');$('successText').textContent=(lang==='ar'?'تم استلام طلبك رقم ':'Your order ')+result.orderId+(lang==='ar'?'، والإجمالي ':' has been received. Total: ')+money(result.total)}catch(err){$('error').textContent=err.message;await updateQuote()}finally{btn.disabled=false;btn.textContent=T[lang].place}};init();
</script><script src="./lovar-effects.js" defer></script>
</body></html>

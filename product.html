<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f5ef"><title>LOVAR | Product</title>
<style>
:root{--ink:#211f1b;--muted:#817c72;--gold:#ad8c51;--ivory:#f8f5ef;--paper:#fffdfa;--line:#e9e3d8;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px var(--sans)}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.site-header{height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 6.2%;border-bottom:1px solid var(--line)}.logo{font:600 39px var(--serif);letter-spacing:.19em}.actions{display:flex;gap:18px;align-items:center}.plain{border:0;background:none;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.count{background:var(--gold);color:white;border-radius:50%;padding:4px 7px}.wrap{max-width:1160px;margin:55px auto;padding:0 24px}.crumb{font-size:10px;color:var(--muted);margin-bottom:28px}.product{display:grid;grid-template-columns:1.05fr .95fr;gap:7%;align-items:start}.photo{background:#f0ece5;min-height:540px}.photo img{width:100%;height:540px;object-fit:cover;display:block}.details{padding:28px 0}.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}.name{font:500 clamp(38px,5vw,58px)/.98 var(--serif);margin:15px 0}.price{font-weight:700;font-size:17px;margin:20px 0}.old{text-decoration:line-through;color:#aaa;margin-inline-start:10px;font-size:13px;font-weight:400}.desc{color:var(--muted);line-height:2;font-size:13px;white-space:pre-line}.stock{font-size:11px;color:var(--muted);margin:24px 0}.buy{display:flex;gap:10px;align-items:center;margin:25px 0}.qty{display:flex;border:1px solid var(--line);height:48px;align-items:center}.qty button{border:0;background:white;width:38px;height:46px}.qty span{min-width:25px;text-align:center}.btn{border:1px solid var(--ink);background:var(--ink);color:white;padding:16px 25px;font-size:10px;letter-spacing:.13em;text-transform:uppercase}.btn:disabled{opacity:.4;cursor:not-allowed}.sub{display:flex;gap:20px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:10px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:13px 20px;display:none}.toast.show{display:block}.related{margin-top:80px;border-top:1px solid var(--line);padding-top:30px}.error{text-align:center;padding:100px 20px;color:var(--muted)}.lang-ar{font-family:Arial,Tahoma,sans-serif}.lang-ar .name{font-family:Arial,Tahoma,sans-serif;line-height:1.35}.lang-ar .logo{letter-spacing:.12em}html[dir=rtl] .site-header{direction:rtl}html[dir=rtl] .product{direction:rtl}html[dir=rtl] .crumb{text-align:right}@media(max-width:720px){.site-header{padding:0 18px;height:70px}.logo{font-size:31px}.wrap{margin:25px auto}.product{grid-template-columns:1fr;gap:12px}.photo,.photo img{min-height:0;height:390px}.details{padding:8px 0}.buy{flex-wrap:wrap}.btn{flex:1}.sub{flex-wrap:wrap}}
</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./lovar-luxe.css">

</head><body><header class="site-header"><a class="logo" href="./index.html">LOVAR</a><div class="actions"><button class="plain" id="languageToggle">العربية</button><a class="plain" href="./index.html#shop" data-t="back">Back to shop</a><a class="plain" href="./checkout.html"><span data-t="bag">Bag</span> <b class="count" id="cartCount">0</b></a></div></header><main class="wrap"><div class="crumb"><a href="./index.html" data-t="home">Home</a> / <a href="./index.html#shop" data-t="shop">Shop</a> / <span id="crumbName">Product</span></div><div id="productRoot" class="error" data-t="loading">Loading product…</div><section class="related"><span class="eyebrow" data-t="promise">THE LOVAR PROMISE</span><p data-t="promiseText">Thoughtful essentials, selected with care and delivered across Egypt.</p></section></main><div class="toast" id="toast"></div><script src="./api-config.js"></script><script src="./api-client.js"></script><script>
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>'EGP '+Number(n||0).toLocaleString('en-EG'), img=u=>/^https:\/\//i.test(String(u||''))?u:'https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?auto=format&fit=crop&w=900&q=80';
let products=[],settings={},cart=JSON.parse(localStorage.getItem('lovar_cart')||'[]'),product=null,qty=1;
const tr={en:{back:'Back to shop',bag:'Bag',home:'Home',shop:'Shop',loading:'Loading product…',promise:'THE LOVAR PROMISE',promiseText:'Thoughtful essentials, selected with care and delivered across Egypt.',add:'ADD TO BAG',stock:'available',out:'Currently out of stock',added:'Added to your bag',notfound:'This product could not be found.',shipping:'Delivery across Egypt',secure:'Cash on delivery available'},ar:{back:'العودة للمتجر',bag:'السلة',home:'الرئيسية',shop:'المتجر',loading:'جاري تحميل المنتج…',promise:'وعد LOVAR',promiseText:'منتجات مختارة بعناية، وتوصيل إلى جميع أنحاء مصر.',add:'أضيفي إلى السلة',stock:'متاح',out:'غير متوفر حاليًا',added:'تمت الإضافة إلى السلة',notfound:'لم يتم العثور على هذا المنتج.',shipping:'توصيل لجميع أنحاء مصر',secure:'الدفع عند الاستلام متاح'}};
function lang(){return window.LovarI18n?.lang()||'en'}function apply(){let l=lang(),d=tr[l];document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.body.classList.toggle('lang-ar',l==='ar');document.querySelectorAll('[data-t]').forEach(e=>e.textContent=d[e.dataset.t]||e.textContent);$('languageToggle').textContent=l==='ar'?'English':'العربية';$('cartCount').textContent=cart.reduce((a,x)=>a+x.quantity,0);if(product)render()}
function save(){localStorage.setItem('lovar_cart',JSON.stringify(cart))}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function render(){let l=lang(),sale=product.salePrice>0&&product.salePrice<product.price;$('crumbName').textContent=product.name;$('productRoot').className='';$('productRoot').innerHTML=`<article class="product"><div class="photo"><img src="${esc(img(product.image))}" alt="${esc(product.name)}"></div><div class="details"><span class="eyebrow">${esc(product.category||'LOVAR')}</span><h1 class="name">${esc((l==='ar'&&product.nameAr)||product.name)}</h1><div class="price">${money(sale?product.salePrice:product.price)} ${sale?`<span class="old">${money(product.price)}</span>`:''}</div><p class="desc">${esc((l==='ar'&&product.descriptionAr)||product.description||'')}</p><p class="stock">${product.stock>0?product.stock+' '+tr[l].stock:tr[l].out}</p><div class="buy"><div class="qty"><button id="minus">−</button><span id="qty">1</span><button id="plus">+</button></div><button class="btn" id="add" ${product.stock<1?'disabled':''}>${tr[l].add}</button></div><div class="sub"><span>✦ ${tr[l].shipping}</span><span>✦ ${tr[l].secure}</span></div></div></article>`;$('minus').onclick=()=>{qty=Math.max(1,qty-1);$('qty').textContent=qty};$('plus').onclick=()=>{qty=Math.min(Math.max(1,product.stock),qty+1);$('qty').textContent=qty};$('add').onclick=()=>{let line=cart.find(x=>x.productId===product.id);if(line)line.quantity=Math.min(product.stock,line.quantity+qty);else cart.push({productId:product.id,quantity:qty});save();apply();toast(tr[l].added)}}
async function init(){apply();try{let data=await LovarApi.call('getPublicData',[]);products=data.products||[];settings=data.settings||{};let id=new URLSearchParams(location.search).get('id');product=products.find(p=>String(p.id)===String(id));if(!product){$('productRoot').className='error';$('productRoot').textContent=tr[lang()].notfound;return}render();document.title=product.name+' | LOVAR'}catch(e){$('productRoot').textContent=e.message;console.error(e)}}$('languageToggle').onclick=()=>{localStorage.setItem('lovar_lang',lang()==='en'?'ar':'en');apply()};init();
</script><script src="./lovar-effects.js" defer></script>
</body></html>
